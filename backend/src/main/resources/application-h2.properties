server.port=8080

# H2 Database configuration (works without external MySQL server)
spring.datasource.url=jdbc:h2:mem:hostel_finder;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=false

# For demo only: keep a long secret (HS256 requires length)
app.jwt.secret=CHANGE_ME_DEMO_SECRET_CHANGE_LATER_1234567890_CHANGE_ME_DEMO_SECRET_CHANGE_LATER
app.jwt.expMinutes=60

# File uploads
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Spring Mail (dummy setup for testing - will log to console if auth fails)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=false

